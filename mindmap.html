# Open Science
- Method of conducting research in which practices, processes, and results are transparent and accessible to the public 


## Big Team Science
- Collaboration across labs
- Large-scale research networks
- Shared tools & data

## Replication Crisis
- Poor reproducibility in psychology
- Need for replication studies
- Transparent methods

## WEIRD Populations
- Western, Educated, Industrialized, Rich, Democratic
- Overrepresented in research
- Limits generalizability

## Research Credibility
- Preregistration
- Registered Reports
- Open Data & Materials

## Open Science Principles
- Transparency
- Accessibility
- Reproducibility
